name: "Container Supply Chain Pipeline"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: "Python Policy & Gatekeeper Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Unit Tests
        run: |
          python3 -m unittest discover -s tests -p "test_*.py"

  build-and-gate:
    name: "Hydrate, Scan, Gate & Sign"
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Hardened Container
        run: |
          docker build -f docker/Dockerfile.hardened -t intake.registry.corp/payments/core-api:${{ github.sha }} .

      - name: Install Trivy & Syft
        uses: aquasecurity/setup-trivy@v0.2.2
        with:
          version: "v0.50.0"

      - name: Run Vulnerability Scan
        run: |
          mkdir -p reports
          trivy image --format json --output reports/trivy-scan.json intake.registry.corp/payments/core-api:${{ github.sha }} || true

      - name: Evaluate Security Gatekeeper
        run: |
          python3 src/gatekeeper.py \
            --report reports/trivy-scan.json \
            --policy policies/security_gate_rules.yaml \
            --waivers policies/cve_waivers.yaml \
            --output-verdict reports/gatekeeper-verdict.json

      - name: Generate CycloneDX SBOM
        run: |
          python3 src/sbom_generator.py \
            --image intake.registry.corp/payments/core-api:${{ github.sha }} \
            --output reports/sbom-cyclonedx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Promote to Golden Registry & Attest
        run: |
          python3 src/promotion_daemon.py \
            --intake intake.registry.corp/payments/core-api:${{ github.sha }} \
            --golden golden.registry.corp/payments/core-api:${{ github.sha }} \
            --report reports/trivy-scan.json
